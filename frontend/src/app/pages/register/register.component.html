<div class="custom-head position-fixed top-0 end-0">
  <img class="logo position-absolute top-50 start-50 translate-middle" src="/assets/img/logo.png" alt="img">
</div>

<div class="left-visual d-none d-sm-block d-sm-none d-md-block">
  <img class="start-pic" src="/assets/img/gratisography-cool-cat.png" alt="img">
</div>


<div class="my-tmp" *ngIf="!success">
  <div class="row mb-4">
    <div class="col-md-12">
      <span class="anchor" id="formLogin"></span>

      <div>
        <div>
          <h4 class="mb-4">{{'REGISTER.REGISTER_TITLE' | translate}}</h4>
        </div>

        <div>
          <form class="form" (ngSubmit)="register()">

            <app-email-field #emailField ></app-email-field>

            <app-password-repeat #pwd ></app-password-repeat>

            <button type="submit" class="btn btn-primary mb-2">
              {{'REGISTER.REGISTER_BUTTON' | translate}}
            </button>
          </form>
        </div>
      </div>
    </div>

  </div>
  <div class="row">
    <div class="col text-center">
      <a class="link-opacity-100" routerLink="">{{'REGISTER.LOGIN' | translate}}</a>
    </div>

  </div>
</div>

<div class="my-tmp text-center" style="font-size: large" [hidden]="!success">
  <div class="h6">
    {{'REGISTER.CHECK_MAILBOX' | translate}}
  </div>
  <button class="btn btn-primary" (click)="request()" [ngClass]="resent ? 'disabled' : null">
    resend link
  </button>
  <app-circle-load #circleLoader [time]="mailRequestTimout/1000" [radius]="60"></app-circle-load>
</div>

<div class="position-absolute end-0 bottom-0 mb-4 me-4">
  <app-lang-select></app-lang-select>
</div>
