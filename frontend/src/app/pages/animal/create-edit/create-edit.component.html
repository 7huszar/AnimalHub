<app-header></app-header>

<div class="container" style="min-width: 95%">
  <form #form="ngForm" [class.was-validated]="form.submitted" (ngSubmit)="onSubmit(form)" class="custom-form">

    <!--   START - DELETE & SAVE BUTTONS-->
    <div class="row justify-content-end mb-3" style="min-height: 2em">
      <div class="col-auto">
        <div class="btn-group" style="min-width: 15%">
          <button *ngIf="!modeIsCreate" type="button" class="custom-danger-btn"
          data-bs-toggle="modal"
          data-bs-target="#confirm-delete-dialog"
          aria-label="Delete animal">
          <i class="bi bi-trash-fill"></i>
          </button>
          <button type="submit" class="custom-success-btn" [disabled]="!form.valid && !animalImageSelected">
            <i class="bi bi-floppy-fill"></i>
          </button>
        </div>
      </div>
    </div>
    <!--  END - DELETE & SAVE BUTTONS-->

    <div class="custom-row">
      <div class="custom-input">
        <div class="custom-row-inner">
          <label for="animalName" class="custom-label">
            {{'ANIMAL_CREATE_EDIT_PAGE.NAME' | translate}}
          </label>
          <div class="custom-field">
            <input type="text" id="animalName" name="animalName"
                   class="form-control" [class]="dynamicCssClassesForInput(animalNameModel)" [(ngModel)]="animal.name"
                   maxlength="100" #animalNameModel="ngModel" required>
          </div>
          <div class="invalid-feedback">
            Name is required
          </div>
        </div>
      </div>
      <div class="custom-input">
        <div class="custom-row-inner">
          <label for="animalSpecies" class="custom-label">
            {{'ANIMAL_CREATE_EDIT_PAGE.GENDER' | translate}}
          </label>
          <div class="custom-field">
            <select class="form-select" id="animalGender" name="animalGender" [(ngModel)]="animal.gender" required>
              <option value="MALE">{{'ANIMAL_CREATE_EDIT_PAGE.MALE' | translate}}</option>
              <option value="FEMALE">{{'ANIMAL_CREATE_EDIT_PAGE.FEMALE' | translate}}</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="custom-row">
      <div class="custom-input">
        <div class="custom-row-inner">
          <label for="animalEnglishDescription" class="custom-label">
            {{'ANIMAL_CREATE_EDIT_PAGE.ENGLISH_DESCRIPTION' | translate}}
          </label>
          <div class="custom-field">
              <textarea rows="3" cols="160" id="animalEnglishDescription" name="animalEnglishDescription"
                        class="form-control" [class]="dynamicCssClassesForInput(animalEnglishDescriptionModel)"
                        [(ngModel)]="animal.englishDescription"
                        maxlength="500" #animalEnglishDescriptionModel="ngModel"></textarea>
          </div>
        </div>
      </div>
      <div class="custom-input">
        <div class="custom-row-inner">
          <label for="animalGermanDescription" class="custom-label">
            {{'ANIMAL_CREATE_EDIT_PAGE.GERMAN_DESCRIPTION' | translate}}
          </label>
          <div class="custom-field">
              <textarea rows="3" cols="160" id="animalGermanDescription" name="animalGermanDescription"
                        class="form-control" [class]="dynamicCssClassesForInput(animalGermanDescriptionModel)"
                        [(ngModel)]="animal.germanDescription"
                        maxlength="500" #animalGermanDescriptionModel="ngModel"></textarea>
          </div>
        </div>
      </div>
    </div>


    <div class="custom-row">
      <div class="custom-input">
        <div class="custom-row-inner">
          <label for="animalSpecies" class="custom-label">
            {{'ANIMAL_CREATE_EDIT_PAGE.SPECIES' | translate}}
          </label>
          <div class="custom-field">
            <select class="form-select" id="animalSpecies" name="animalSpecies" [(ngModel)]="animal.species" required>
              <option value="DOG">{{'ANIMAL_CREATE_EDIT_PAGE.DOG' | translate}}</option>
              <option value="CAT">{{'ANIMAL_CREATE_EDIT_PAGE.CAT' | translate}}</option>
              <option value="BIRD">{{'ANIMAL_CREATE_EDIT_PAGE.BIRD' | translate}}</option>
              <option value="RODENT">{{'ANIMAL_CREATE_EDIT_PAGE.RODENT' | translate}}</option>
            </select>
          </div>
        </div>
      </div>
      <div class="custom-input">
        <div class="custom-row-inner">
          <label for="animalEnglishRace" class="custom-label">
            {{'ANIMAL_CREATE_EDIT_PAGE.ENGLISH_RACE' | translate}}
          </label>
          <div class="custom-field">
            <input type="text" id="animalEnglishRace" name="animalEnglishRace" class="form-control"
                   [class]="dynamicCssClassesForInput(animalEnglishRaceModel)" [(ngModel)]="animal.englishRace"
                   maxlength="120" #animalEnglishRaceModel="ngModel" required>
          </div>
          <div class="invalid-feedback">
            Race is required
          </div>
        </div>
      </div>
    </div>

    <div class="custom-row">
      <div class="custom-input">
        <div class="custom-row-inner">
          <label for="animalHeight" class="custom-label">
            {{'ANIMAL_CREATE_EDIT_PAGE.HEIGHT' | translate}} [m]
          </label>
          <div class="custom-field">
            <input type="number" class="form-control" id="animalHeight" name="animalHeight" step="0.01"
                   [(ngModel)]="animal.height" required>
          </div>
        </div>
      </div>
      <div class="custom-input">
        <div class="custom-row-inner">
          <label for="animalGermanRace" class="custom-label">
            {{'ANIMAL_CREATE_EDIT_PAGE.GERMAN_RACE' | translate}}
          </label>
          <div class="custom-field">
            <input type="text" id="animalGermanRace" name="animalGermanRace" class="form-control"
                   [class]="dynamicCssClassesForInput(animalGermanRaceModel)" [(ngModel)]="animal.germanRace"
                   maxlength="120" #animalGermanRaceModel="ngModel" required>
          </div>
          <div class="invalid-feedback">
            Race is required
          </div>
        </div>
      </div>
    </div>

    <div class="custom-row">
      <div class="custom-input">
        <div class="custom-row-inner">
          <label for="animalWeight" class="custom-label">
            {{'ANIMAL_CREATE_EDIT_PAGE.WEIGHT' | translate}} [kg]
          </label>
          <div class="custom-field">
            <input type="number" class="form-control" id="animalWeight" name="animalWeight" step="0.1"
                   [(ngModel)]="animal.weight" required>
          </div>
        </div>
      </div>
      <div class="custom-input">
        <div class="custom-row-inner">
          <label for="animalBirthDate" class="custom-label">
            {{'ANIMAL_CREATE_EDIT_PAGE.BIRTHDATE' | translate}}
          </label>
          <div class="custom-field">
            <input type="date" lang="de" id="animalBirthDate" name="animalBirthDate" pattern="\d{4}-\d{2}-\d{2}"
                   class="form-control" max="{{today}}" [class]="dynamicCssClassesForInput(AnimalBirthDateModel)"
                   [(ngModel)]="animal.birthDate" #AnimalBirthDateModel="ngModel" required>
          </div>
          <div class="invalid-feedback">
            Date of birth is required
          </div>
        </div>
      </div>
    </div>

    <div class="row justify-content-end">
      <div class="custom-input">
        <div class="custom-row-inner">
          <label for="animalImage" class="custom-label">
            {{'ANIMAL_CREATE_EDIT_PAGE.IMAGE' | translate}}
          </label>
          <div class="custom-field">
            <div class="custom-input">
              <label for="animalImage" class="custom-button">Select Image</label>
              <input type="file" style="visibility: hidden" id="animalImage" name="animalImage"
                     accept="image/png, image/jpeg, image/gif, image/bmp"
                     (change)="onImageSelected($event)" class="form-control" required>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- upload image -->
    <div class="row justify-content-end">
      <div class="selected-pic" style="align-self: flex-end" (drop)="dropped($event)"
           (dragenter)="enterDropZone($event)"
           (dragleave)="leaveDropZone($event)"
           [style.border-style]="animalImageURL ? 'none' : 'dashed'">
        <div *ngIf="!animalImageURL" style="pointer-events: none;">
          <i class="bi bi-file-earmark-plus text-primary" style="font-size: 80px;" [ngClass]="dropZoneColor"></i> <br>
          {{'ANIMAL_CREATE_EDIT_PAGE.DRAG_AND_DROP' | translate}}
        </div>
        <img *ngIf="animalImageURL" [src]="animalImageURL" alt="" [style.object-fit]="'contain'" class="img-fluid">
      </div>
      <div class="custom-submit">
        <div class="row">
          <div class="col-12 col-sm-8 offset-sm-4 col-xl-6 offset-xl-6">
            <button type="submit" class="custom-button" [disabled]="!form.valid">
              {{submitButtonText}}
            </button>
          </div>
          <div class="col-12 col-sm-8 offset-sm-4 col-xl-6 offset-xl-6">
            <button type="button" class="btn btn-sm btn-danger"
                    (click)="animalForDeletion(animal.name, animal.id)"
                    data-bs-toggle="modal"
                    data-bs-target="#confirm-delete-dialog"
                    aria-label="Delete shelter">
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        </div>
      </div>
    </div>
    <app-confirm-delete-dialog [deleteName]="nameForDeletion" [DeleteId]="idForDeletion" [deleteType]="typeForDeletion" ></app-confirm-delete-dialog>
  </form>
</div>
