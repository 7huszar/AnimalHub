<app-header></app-header>
<div class="container">
  <form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" [(ngModel)]="contact.name" name="name" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" [(ngModel)]="contact.from" name="email" required>
    </div>
    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea class="form-control" id="message" [(ngModel)]="contact.message" name="message" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="!contactForm.form.valid">Submit</button>
  </form>
</div>
<app-lang-select></app-lang-select>
<app-footer></app-footer>
