<div class="custom-head position-fixed top-0 end-0">
  <img class="logo position-absolute top-50 start-50 translate-middle" src="/assets/img/logo.png" alt="img">
</div>

<div class="left-visual d-none d-sm-block d-sm-none d-md-block">
  <img class="start-pic" src="/assets/img/gratisography-cool-cat.png" alt="img">
</div>

<div class="my-tmp">
  <div class="row mb-4">
    <div class="col-md-12">
      <span class="anchor" id="emailForm"></span>

      <div>
        <div>
          <h5 *ngIf="!sent" class="mb-4">{{'PWD.INSTRUCTION' | translate}}</h5>
          <h5 *ngIf="sent">{{'PWD.INFO' | translate}}</h5>
        </div>

        <div>
          <form class="form" [formGroup]="emailForm">

            <div class="form-group mb-4">
              <input type="text" name="email" formControlName="email" class="form-control form-control-lg"
                     aria-describedby="usernameHelp" placeholder="{{'PWD.MAIL' | translate}}" [ngClass]="submitted ? validation() : null">
              <div *ngIf="submitted && !isValid()" class="error">
                <small *ngIf="emailForm.controls.email?.errors.required" class="form-text text-danger">
                  {{'REGISTER.MAIL_MISSING' | translate}}
                </small>
                <small *ngIf="emailForm.controls.email?.errors.email" class="form-text text-danger">
                  {{'REGISTER.MAIL_INVALID' | translate}}
                </small>
              </div>

            </div>

            <button [disabled]="timeout" type="submit" (click)="requestPasswordReset()" class="btn btn-primary mb-2 form-control-lg">
              <div *ngIf="!sent">
                {{'PWD.CONTINUE' | translate}}
              </div>
              <div *ngIf="sent">
                resend mail
              </div>
            </button>
          </form>
        </div>
      </div>

      <div class="text-center">
        <app-circle-load #circleLoader [time]="waitingTime / 1000" [radius]="60" ></app-circle-load>
        <h6 [hidden]="!timeout" class="text-danger">
          Wait a minute before resending a mail
        </h6>
      </div>
    </div>
  </div>
</div>
