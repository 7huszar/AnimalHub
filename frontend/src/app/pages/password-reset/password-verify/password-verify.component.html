<div class="custom-head position-fixed top-0 end-0">
  <img class="logo position-absolute top-50 start-50 translate-middle" src="/assets/img/logo.png" alt="img">
</div>

<div class="left-visual d-none d-sm-block d-sm-none d-md-block">
  <img class="start-pic" src="/assets/img/gratisography-cool-cat.png" alt="img">
</div>

<div class="my-tmp">
  <div class="row mb-4">
    <div class="col-md-12">
      <span class="anchor" id="formLogin"></span>

      <div>
        <div>
          <h4 class="mb-4">reset password</h4>
        </div>

        <div>
          <form class="form" [formGroup]="passwordForm">

            <div class="form-group mb-4">
              <input type="password" name="password" formControlName="password" class="form-control form-control-lg" id="inputUsername"
                     aria-describedby="usernameHelp" placeholder="password" [ngClass]="submitted ? validation() : null">
              <div *ngIf="submitted && !passwordForm.controls.password.valid" class="error">
                <small *ngIf="passwordForm.controls.password.errors.required" class="form-text text-danger">
                  {{'REGISTER.PWD_MISSING' | translate}}
                </small>
                <small *ngIf="passwordForm.controls.password.errors.minlength" class="form-text text-danger">
                  {{'REGISTER.PWD_SHORT' | translate}}
                </small>
              </div>
            </div>

            <div class="form-group mb-4">
              <input type="password" name="passwordRepeat" formControlName="passwordRepeat" class="form-control form-control-lg" id="password"
                     placeholder="repeat password" [ngClass]="submitted ? validation() : null">

              <div *ngIf="submitted && !passwordForm.controls.passwordRepeat.valid" class="error">
                <small *ngIf="passwordForm.controls.passwordRepeat.errors.required" class="form-text text-danger">
                  {{'REGISTER.PWD_REPEAT_MISSING' | translate}}
                </small>
              </div>

              <div *ngIf="submitted && passwordForm.valid && !pwdMatch()" class="error">
                <small class="form-text text-danger">
                  {{'REGISTER.PWD_MISS_MATCH' | translate}}
                </small>
              </div>
            </div>

            <div class="form-group mb-2"></div>

            <button type="button" class="btn btn-primary mb-2 form-control-lg" (click)="reset()">
              reset
            </button>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>
