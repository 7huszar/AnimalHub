<div class="custom-head position-fixed top-0 end-0">
  <img class="logo position-absolute top-50 start-50 translate-middle" src="/assets/img/logo.png" alt="img">
</div>

<div class="left-visual d-none d-sm-block d-sm-none d-md-block">
  <img class="start-pic" src="/assets/img/gratisography-cool-cat.png" alt="img">
</div>


<div class="my-tmp">
  <div class="row mb-4">
    <div class="col-md-12">
      <span class="anchor" id="formLogin"></span>

      <div>
        <div>
          <h4 class="mb-4">{{'LOGIN.LOGIN_TITLE' | translate}}</h4>
        </div>

        <div>
          <form class="form" (ngSubmit)="loginUser()">
            <app-email-field #emailField></app-email-field>
            <app-password #pwdField></app-password>

            <div *ngIf="failedLogin" class="error">
              <small class="form-text text-danger">
                {{'LOGIN.BAD_CREDENTIALS' | translate}}
              </small>
            </div>

            <div class="form-group mb-2"></div>

            <button type="submit" class="btn btn-primary mb-2 form-control-lg">
              {{'LOGIN.LOGIN_BUTTON' | translate}}
            </button>
          </form>
        </div>
      </div>
    </div>

  </div>
  <div class="row">
    <div class="col">
      <a class="link-opacity-100" routerLink="/password/request-reset">{{'LOGIN.FORGOT_PWD' | translate}}</a>
    </div>
    <div class="col float-end text-end">
      <a class="link-opacity-100" routerLink="/register">{{'LOGIN.REGISTER' | translate}}</a>
    </div>
  </div>
  <div class="row">
      <div class="col">
          <a class="link-opacity-100" data-bs-toggle="modal" data-bs-target="#myModal">{{'LOGIN.HOW_DOES_IT_WORK' | translate}}</a>
      </div>
  </div>
</div>
<div class="modal fade" id="myModal">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">{{'LOGIN.HOW_DOES_IT_WORK' | translate}}</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="overflow-auto" style="object-fit: cover; max-height: 50em">
                    <img class="start-pic" src="/assets/img/HowDoesItWork.png" alt="img">
                </div>
            </div>
        </div>
    </div>


</div>
<div class="position-absolute end-0 bottom-0 mb-4 me-4">
<app-lang-select></app-lang-select>
</div>
