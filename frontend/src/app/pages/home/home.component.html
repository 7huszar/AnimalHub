<app-header></app-header>


<div class="container-fluid">
  <div class="row">
    <div class="col-1"></div>
    <div class="col center-column">
      <button class="bi bi-funnel-fill text-primary btn align-self-start" aria-label="Filter">
        Filter
      </button>
    </div>
    <!-- Burger Menu -->
    <div class="col-1 text-end">
      <button class="bi bi-list text-white btn btn-primary rounded align-self-start" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        Menu
      </button>
      <div class="dropdown-menu bg-primary" aria-labelledby="dropdownMenuButton">
        <!-- Dropdown items go here -->
        <a class="dropdown-item" *ngIf="authService.isMember()" [routerLink]="['/users/shelter/' + shelterId]" > Edit Shelter
        </a>
        <a class="dropdown-item" [routerLink]="['/users/subscriptions']">My Subscriptions</a>
      </div>
    </div>
<!-- End of burger Menu -->
  </div>


  <div class="row">
    <div class="col-1 center-column">
      <i class="arrow bi-chevron-compact-left" (click)="leftClick()"></i>
    </div>
    <div class="col center">
      <div class ="row" style="justify-content: center">
        <div class="col-auto">
          <app-animal-card [name]="getCard(Position.LEFT)?.name"
                           [id]="getCard(Position.LEFT)?.id"
                           (like)="like(getCard(Position.LEFT))"
                           (dislike)="dislike(getCard(Position.LEFT))"
                           [empty]="emptyLeft">
          </app-animal-card>
        </div>
        <div class="col-auto">
          <app-animal-card [name]="getCard(Position.MIDDLE)?.name"
                           [id]="getCard(Position.MIDDLE)?.id"
                           (like)="like(getCard(Position.MIDDLE))"
                           (dislike)="dislike(getCard(Position.MIDDLE))"
                           [empty]="emptyMiddle">
          </app-animal-card>
        </div>
        <div class="col-auto">
          <app-animal-card [name]="getCard(Position.RIGHT)?.name"
                           [id]="getCard(Position.RIGHT)?.id"
                           (like)="like(getCard(Position.RIGHT))"
                           (dislike)="dislike(getCard(Position.RIGHT))"
                           [empty]="emptyRight">
          </app-animal-card>
        </div>
      </div>
    </div>
    <div class="col-1 center-column">
      <i class="arrow bi-chevron-compact-right" (click)="rightClick()"></i>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <div class="headings">
        <div style="overflow: auto; padding-left: 0; padding-top: 1rem">
          <h1 style="float: left">{{'HOME.FAVORITES_TITLE' | translate}}</h1>
        </div>
      </div>
    </div>
  </div>
  <div class="row" *ngIf="likedAnimals?.length > 0" style="padding: 3rem; padding-top: 1rem; justify-content: center">
    <div class="col-auto" *ngFor="let animal of likedAnimals">
      <app-favorites-card [name]="animal.name"
                          [id]="animal.id"
                          (remove)="remove(animal)">
      </app-favorites-card>
    </div>
  </div>
  <div class="container" *ngIf="likedAnimals?.length === 0" style="background-color: lightgray; margin-top: 2rem; height: 10rem; display: flex; align-items: center; justify-content: center">
    <p style="font-size: 2rem; margin: 0">{{'HOME.NO_FAVORITES' | translate}}</p>
  </div>
</div>
