<app-header ></app-header>


<div class="container">
  <h1 class="m-4" style="display: flex; align-items: center;">
    Donations received by {{ authService.getUser().shelter.name }}
  </h1>

  <table class="table table-hover m-3">
    <!-- Donation Table -->
    <thead>
    <tr>
      <th>Date</th>
      <th>Type</th>
      <th>receiver</th>
      <th>Amount</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let donation of donations" class="center-td">
      <td>{{ donation.date }}</td>
      <td>{{ mapType(donation.type) }}</td>
      <td>{{ donation.receiver }}</td>
      <td>{{ formatMoney(donation) }}</td>
    </tr>
    <tr>
      <td colspan="3" style="text-align: right;">Total:</td>
      <td>{{ total.toFixed(2) + ' €' }}</td>
    </tr>
    </tbody>
  </table>
</div>

<app-donation-bar-graph [shelter]="shelter"></app-donation-bar-graph>
