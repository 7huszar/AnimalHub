<app-header></app-header>

  <h1 class="mt-4 mb-4" style="display: flex; align-items: center;">Subscriptions of {{ user?.email }}
    <button class="btn btn-primary" style="padding: 0.2rem 0.5rem; margin-top: auto; margin-left: auto;" (click)="goBack()">Go back</button>
  </h1>

    <!-- Create Subscriptions Section -->
    <div class="col-md-6">
      <div class="row">

      <div class="mt-3">
        <table class="table table-hover">
          <!-- Subscriptions Table -->
          <thead>
          <tr>
            <th>Name</th>
            <th>Add profile Pic</th>

            <th class="min-width text-end">Actions</th> <!-- Align the header to the end (right) -->
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let subscriptions of subscriptionList" class="center-td">
            <td>{{ subscriptions.animal.name }}</td>
            <td>Add profile pictures </td>

            <td class="text-end"> <!-- Align the actions to the end (right) -->
              <div class="btn-group">

                <button type="button" class="btn btn-sm btn-danger"
                        (click)="subscriptionForDeletion(subscriptions.animal.name, subscriptions.subscriptionId, subscriptions.animal.shelter.id)"
                        data-bs-toggle="modal"
                        data-bs-target="#confirm-delete-dialog"
                        aria-label="Cancel Subscription">
                        Cancel Subscription
                </button>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
        <app-confirm-delete-dialog [deleteWhat]="nameForDeletion" [DeleteId]="idForDeletion" [deleteType]="typeForDeletion" [cancelShelter]="cancelShelter"></app-confirm-delete-dialog>

      </div>
  </div>
