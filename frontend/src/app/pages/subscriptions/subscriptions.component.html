<app-header></app-header>

<div class="container mt-3">
  <h1 class="d-flex align-items-middle" style="margin-left: -200px">
    Subscriptions of {{ user?.email }}
    <button class="btn btn-primary ms-auto" style="padding: 0.2rem 0.5rem;" (click)="goBack()">Go back</button>
  </h1>

  <!-- Create Subscriptions Section -->
  <div class="row">
    <div class="col-md-4">
      <div class="mt-3" style="margin-left: -200px">
        <table class="table table-hover">
          <thead class="table-primary">
          <tr>
            <th>Name</th>
            <th>Profile Picture</th>
            <th class="text-end">Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let subscriptions of subscriptionList" class="center-td">
            <td class="align-middle">{{ subscriptions.animal.name }}</td>
            <td class="align-middle">
              <div class="row mb-3">
                <div>
                  <img *ngIf="shelterImageURL" [src]="shelterImageURL" class="img-thumbnail"
                       style="max-height: 100px; max-width: 100px;" alt="{{ subscriptions.animal.name }} Image">
                </div>
              </div>
            </td>
            <td class="text-end align-middle">
              <div class="btn-group">
                <button type="button" class="btn btn btn-danger"
                        (click)="subscriptionForDeletion(subscriptions.animal.name, subscriptions.subscriptionId, subscriptions.animal.shelter.id)"
                        data-bs-toggle="modal" data-bs-target="#confirm-delete-dialog" aria-label="Cancel Subscription">
                  Cancel
                </button>
                <button type="button" class="btn btn-primary" [routerLink]="['/animal', subscriptions.animal.id]">Details</button>

              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<app-confirm-delete-dialog [deleteName]="nameForDeletion" [DeleteId]="idForDeletion" [deleteType]="typeForDeletion"
                           [cancelShelter]="cancelShelter"></app-confirm-delete-dialog>
