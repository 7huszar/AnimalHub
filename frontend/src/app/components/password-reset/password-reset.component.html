<div class="custom-head position-fixed top-0 end-0">
  <img class="logo position-absolute top-50 start-50 translate-middle" src="/assets/img/logo.png" alt="img">
</div>

<div class="left-visual d-none d-sm-block d-sm-none d-md-block">
  <img class="start-pic" src="/assets/img/gratisography-cool-cat.png" alt="img">
</div>

<div class="my-tmp">
  <div class="row mb-4">
    <div class="col-md-12">
      <span class="anchor" id="emailForm"></span>

      <div>
        <div>
          <h4 class="mb-4">reset password</h4>
        </div>

        <div>
          <form class="form" [formGroup]="emailForm">

            <div class="form-group mb-4">
              <input type="text" name="email" formControlName="email" class="form-control form-control-lg"
                     aria-describedby="usernameHelp" placeholder="{{'LOGIN.USERNAME_PLACEHOLDER' | translate}}">
            </div>

            <div class="form-group mb-2"></div>

            <button type="button" (click)="requestPasswordReset()" class="btn btn-primary mb-2 form-control-lg">
              reset
            </button>
          </form>
        </div>
      </div>
    </div>
