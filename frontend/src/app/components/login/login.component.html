<div *ngIf="error" xmlns="http://www.w3.org/1999/html" class="alert alert-warning alert-dismissible fade show"
     role="alert">
  <strong>Authentication problems!</strong> {{ errorMessage }}
  <button type="button" (click)="vanishError()" class="close" data-dismiss="alert" aria-label="Close">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="custom-head position-fixed top-0 end-0">
  <img class="logo position-absolute top-50 start-50 translate-middle" src="/assets/img/logo.png" alt="img">
</div>

<div class="left-visual">
  <img class="start-pic" src="/assets/img/gratisography-cool-cat.png" alt="img">
</div>

<div class="my-tmp">
  <div class="row">
    <div class="col-md-6">
      <span class="anchor" id="formLogin"></span>

      <div>
        <div>
          <h4 class="mb-2">{{'LOGIN.LOGIN_TITLE' | translate}}</h4>
        </div>

        <div>
          <form class="form" [formGroup]="loginForm" (ngSubmit)="loginUser()">

            <div class="form-group mb-2">
              <input type="text" name="username" formControlName="username" class="form-control" id="inputUsername"
                     aria-describedby="usernameHelp" placeholder="{{'LOGIN.USERNAME_PLACEHOLDER' | translate}}">
              <div *ngIf="submitted && loginForm.controls.username.errors" class="error">
                <small class="form-text text-warning" *ngIf="loginForm.controls.username.errors.required">Your username is
                  required!
                </small>
              </div>
            </div>

            <div class="form-group mb-2">
              <input type="password" name="password" formControlName="password" class="form-control" id="password"
                     placeholder="{{'LOGIN.PWD_PLACEHOLDER' | translate}}">
              <div *ngIf="submitted && loginForm.controls.password.errors" class="error">
                <small class="form-text text-warning" *ngIf="loginForm.controls.password.errors.required">Your password
                  is
                  required!
                </small>
                <small class="form-text text-warning" *ngIf="loginForm.controls.password.errors.minlength">Your password
                  must be at least 8 characters long!
                </small>
              </div>
            </div>

            <button type="button" (click)="loginUser()" class="btn btn-primary mb-2">{{'LOGIN.LOGIN_BUTTON' | translate}}</button>

          </form>


        </div>

      </div>


    </div>

  </div>
  <div class="row">
    <div class="col-md-3">
      <a class="link-opacity-100" routerLink="/message">{{'LOGIN.FORGOT_PWD' | translate}}</a>
    </div>
    <div class="col-md-3 align-self-end text-end">
      <a class="link-opacity-100" routerLink="/register">{{'LOGIN.REGISTER' | translate}}</a>
    </div>
  </div>
</div>

<div class="position-absolute end-0 bottom-0 mb-4 me-4">
<app-lang-select></app-lang-select>
</div>
