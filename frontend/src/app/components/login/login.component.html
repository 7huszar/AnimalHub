<div class="custom-head position-fixed top-0 end-0">
  <img class="logo position-absolute top-50 start-50 translate-middle" src="/assets/img/logo.png" alt="img">
</div>

<div class="left-visual d-none d-sm-block d-sm-none d-md-block">
  <img class="start-pic" src="/assets/img/gratisography-cool-cat.png" alt="img">
</div>


<div class="my-tmp">
  <div class="row mb-4">
    <div class="col-md-12">
      <span class="anchor" id="formLogin"></span>

      <div>
        <div>
          <h4 class="mb-4">{{'LOGIN.LOGIN_TITLE' | translate}}</h4>
        </div>

        <div>
          <form class="form" [formGroup]="loginForm" (ngSubmit)="loginUser()">

            <div class="form-group mb-4">
              <input type="text" name="username" formControlName="username" class="form-control form-control-lg"
                     [ngClass]="isEmailInvalid ? invalidEmail() : loginForm.controls.username.valid ? validForm() : invalidForm()" id="inputUsername"
                     aria-describedby="usernameHelp" placeholder="{{'LOGIN.USERNAME_PLACEHOLDER' | translate}}">
              <div *ngIf="submitted && loginForm.controls.username.errors" class="error">
                <small class="form-text text-danger" *ngIf="loginForm.controls.username.errors.required">
                  {{'LOGIN.USER_NAME_MISSING' | translate}}
                </small>
                <small class="form-text text-danger" *ngIf="loginForm.controls.username.errors.email">
                  {{'LOGIN.MAIL_INVALID' | translate}}
                </small>
              </div>
            </div>

            <div class="form-group mb-4">
              <input type="password" name="password" formControlName="password" class="form-control form-control-lg"
                     [ngClass]="isPwdInvalid ? invalidPwd() : loginForm.controls.password.valid ? validForm() : invalidForm()" id="password"
                     placeholder="{{'LOGIN.PWD_PLACEHOLDER' | translate}}">
              <div *ngIf="submitted && loginForm.controls.password.errors" class="error">
                <small class="form-text text-danger" *ngIf="loginForm.controls.password.errors.required">
                  {{'LOGIN.PWD_MISSING' | translate}}
                </small>
                <small class="form-text text-danger" *ngIf="loginForm.controls.password.errors.minlength">
                  {{'LOGIN.PWD_SHORT' | translate}}
                </small>
              </div>
            </div>

            <div *ngIf="failedLogin" class="error">
              <small class="form-text text-danger">
                {{'LOGIN.BAD_CREDENTIALS' | translate}}
              </small>
            </div>

            <div class="form-group mb-2"></div>

            <button type="button" (click)="loginUser()" class="btn btn-primary mb-2 form-control-lg">
              {{'LOGIN.LOGIN_BUTTON' | translate}}
            </button>
          </form>
        </div>
      </div>
    </div>

  </div>
  <div class="row">
    <div class="col">
      <a class="link-opacity-100" routerLink="">{{'LOGIN.FORGOT_PWD' | translate}}</a>
    </div>
    <div class="col float-end text-end">
      <a class="link-opacity-100" routerLink="/register">{{'LOGIN.REGISTER' | translate}}</a>
    </div>
  </div>
</div>
<div class="position-absolute end-0 bottom-0 mb-4 me-4">
<app-lang-select></app-lang-select>
</div>
