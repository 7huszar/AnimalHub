<app-header></app-header>

<!--<h1 class="display-1">{{animal.name}}</h1>-->
<div class="container-fluid" style="background-color: lightgray">
  <div class="row">
    <div class="col">
      <div class="headings">
        <div style="display: block; overflow: auto">
          <h1 style=" float: left">{{ animal.name }}</h1>
          <h1 style=" float: right">shelter</h1>
        </div>
        <div style="display: block">
          <h3>{{ animal.race }}</h3>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-auto">
      <div class="media">
        <img [ngSrc]="animalImageURL" alt="ProfileImage" class="img-fluid" style="max-height: 30em">
      </div>
    </div>
    <div class="col">
      <div class="container position-relative" style="height: 100%; padding-left: 0; margin-left: 3rem">
        <div class="row" style="height: 15%">
          <div class="col-md-2">Species:</div>
          <div class="col">{{ animal.species }}</div>
        </div>
        <div class="row" style="height: 15%">
          <div class="col-md-2">Race:</div>
          <div class="col">{{ animal.race }}</div>
        </div>
        <div class="row" style="height: 15%">
          <div class="col-md-2">Date of birth:</div>
          <div class="col">{{ animal.birthDate }}</div>
        </div>
        <div class="row" style="height: 15%">
          <div class="col-md-2">Height:</div>
          <div class="col">{{ animal.height }}</div>
        </div>
        <div class="row" style="height: 15%">
          <div class="col-md-2">Weight:</div>
          <div class="col">{{ animal.weight }}</div>
        </div>
        <div class="row fixed-button align-items-end w-100">
          <div class="col-auto">
            <button type="button" class="btn btn-primary">Für {{ animal.name }} spenden</button>
          </div>
          <div class="col-auto">
            <button type="button" class="btn btn-primary">{{ animal.name }} adoptieren</button>
          </div>
          <div class="col-auto">
            <button type="button" class="btn btn-primary">{{ animal.name }} adoptieren</button>
          </div>
        </div>
      </div>
    </div>
  </div>



  <div class="row">
    <div class="col">
      <div class="headings">
        <div style="overflow: auto; padding-left: 0; padding-top: 1rem">
          <h1 style=" float: left">Media</h1>
        </div>
      </div>
      <div class="content">
        <div class="row">
          <div class="col-lg-4 col-md-12 mb-4 mb-lg-0">
            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Horizontal/Nature/4-col/img%20(73).webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Boat on Calm Water"
            />

            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Vertical/mountain1.webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Wintry Mountain Landscape"
            />
          </div>

          <div class="col-lg-4 mb-4 mb-lg-0">
            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Vertical/mountain2.webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Mountains in the Clouds"
            />

            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Horizontal/Nature/4-col/img%20(73).webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Boat on Calm Water"
            />
          </div>

          <div class="col-lg-4 mb-4 mb-lg-0">
            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Horizontal/Nature/4-col/img%20(18).webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Waves at Sea"
            />

            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Vertical/mountain3.webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Yosemite National Park"
            />
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
