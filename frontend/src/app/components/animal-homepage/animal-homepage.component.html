<app-header></app-header>

<!--<h1 class="display-1">{{animal.name}}</h1>-->
<div class="container-fluid">
  <div class="row">
    <div class="col">
      <div class="headings">
        <div style="display: block; overflow: auto">
          <h1 style=" float: left">{{ animal.name }}</h1>
          <h1 style=" float: right">{{ animal.shelter.name }}</h1>
        </div>
        <div style="display: block">
          <h3>{{ animal.species }}</h3>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-5">
      <div class="media">
        <img src="/assets/img/gratisography-cool-cat.png" alt="Generic placeholder image"  width="100%">
      </div>
    </div>
    <div class="col">
      <div class="container position-relative" style="height: 100%">
        <div class="row">
          <span>Alter: Test</span>
          <span>Alter: Test</span>
        </div>
        <div class="row fixed-button">
          <div class="col">
            <button type="button" class="btn btn-primary">Für $Tiername spenden</button>
          </div>
          <div class="col">
            <button type="button" class="btn btn-primary">Primary</button>
          </div>
        </div>
      </div>

    </div>
  </div>



  <div class="row">
    <div class="col">
      <div class="headings">
        <div style="overflow: auto; padding-left: 0; padding-top: 1rem">
          <h1 style=" float: left">Medien</h1>
        </div>
      </div>
      <div class="content">
        <div class="row">
          <div class="col-lg-4 col-md-12 mb-4 mb-lg-0">
            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Horizontal/Nature/4-col/img%20(73).webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Boat on Calm Water"
            />

            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Vertical/mountain1.webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Wintry Mountain Landscape"
            />
          </div>

          <div class="col-lg-4 mb-4 mb-lg-0">
            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Vertical/mountain2.webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Mountains in the Clouds"
            />

            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Horizontal/Nature/4-col/img%20(73).webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Boat on Calm Water"
            />
          </div>

          <div class="col-lg-4 mb-4 mb-lg-0">
            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Horizontal/Nature/4-col/img%20(18).webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Waves at Sea"
            />

            <img
              src="https://mdbcdn.b-cdn.net/img/Photos/Vertical/mountain3.webp"
              class="w-100 shadow-1-strong rounded mb-4"
              alt="Yosemite National Park"
            />
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
