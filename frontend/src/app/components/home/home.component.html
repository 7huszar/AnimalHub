<app-header></app-header>


<div class="container-fluid">
  <div class="row">
    <div class="col-1"></div>
    <div class="col center-column">
      <button class="bi bi-funnel-fill text-primary btn align-self-start" aria-label="Filter" style="padding-left: 0">
        Filter
      </button>
    </div>
  </div>
  <div class="row">
    <div class="col-1 center-column">
      <i class="bi bi-arrow-left-square-fill text-primary btn" (click)="leftClick()"></i>
    </div>
    <div class="col">
      <app-animal-card [name]="getCard(Position.LEFT)?.name"
                       [id]="getCard(Position.LEFT)?.id"
                       (like)="like(getCard(Position.LEFT))"
                       (dislike)="dislike(getCard(Position.LEFT))">
      </app-animal-card>
    </div>
    <div class="col">
      <app-animal-card [name]="getCard(Position.MIDDLE)?.name"
                       [id]="getCard(Position.MIDDLE)?.id"
                       (like)="like(getCard(Position.MIDDLE))"
                       (dislike)="dislike(getCard(Position.MIDDLE))">
      </app-animal-card>
    </div>
    <div class="col">
      <app-animal-card [name]="getCard(Position.RIGHT)?.name"
                       [id]="getCard(Position.RIGHT)?.id"
                       (like)="like(getCard(Position.RIGHT))"
                       (dislike)="dislike(getCard(Position.RIGHT))">
      </app-animal-card>
    </div>

    <div class="col-1 center-column">
      <i class="bi bi-arrow-right-square-fill text-primary btn" (click)="rightClick()"></i>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <div class="headings">
        <div style="overflow: auto; padding-left: 0; padding-top: 1rem">
          <h1 style="float: left">Favorites</h1>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col align-items-end">
      <div class="mt-3">
        <table class="table table-hover">
          <tbody>
          <tr *ngFor="let animal of animalList" class="center-td">
            <td>{{animal.name}}</td>
            <td><button class="btn btn-primary">{{'ANIMAL_HOMEPAGE.DONATE_1' | translate}}{{animal.name}}</button></td>
            <td><button class="btn btn-primary">{{'ANIMAL_HOMEPAGE.ADOPT' | translate}}{{animal.name}}</button></td>

          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
