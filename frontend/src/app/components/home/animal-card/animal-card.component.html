<div class="card p-2" style="width: 100%;">
  <a routerLink="/animal/{{id}}" style="position: relative">
    <div class="bg-image">
      <app-content [mode]="Mode.ANIMAL" [id]="id" setClass="img-fluid"></app-content>
      <div
        class="mask"
        style="
      background: linear-gradient(
        180deg,
        hsla(9, 100%, 64%, 0) 75%,
        hsla(0, 100%, 100%, 1) 100%
      );
    "
      ></div>
      <div class="card-img-overlay" style="width: 100%; height: 100%">
        <h5 class="card-title" style="position:absolute; bottom: 0; color: black; font-size: xx-large">{{ name }}</h5>
      </div>
    </div>


  </a>
  <div class="row text-center">
    <div class="col">
      <i class="bi bi-x-circle-fill text-danger" (click)="dislike.emit()"></i>
    </div>
    <div class="col">
      <a routerLink="/animal/{{id}}">
        <i class="bi bi-info-circle-fill"></i>
      </a>
    </div>
    <div class="col">
      <i class="bi bi-heart-fill text-primary" (click)="like.emit()"></i>
    </div>
  </div>
</div>
