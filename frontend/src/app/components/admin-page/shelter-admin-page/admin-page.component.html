<app-header></app-header>

<div class="d-flex justify-content-end mt-3">

  <button class="btn btn-primary mr-1" (click)="reloadShelters()" aria-label="Reload Shelters">
    <i class="bi bi-arrow-clockwise"></i>
    Reload
  </button>
  <a class="btn btn-primary mr-1" [routerLink]="'/users'" aria-label="View Users">
    View Users
  </a>

</div>

<div class="d-flex justify-content-end mt-3">
  <a class="btn btn-secondary mr-2" routerLink="/shelter/create" aria-label="New Shelter">
    <i class="bi bi-plus-lg"></i>
    New Shelter
  </a>
</div>


<div class="d-flex justify-content-start mt-3">
  <div class="ms-1">
    <label for="searchShelterName" class="col-form-label">Search for Shelter</label>
    <div class="input-group">
      <input type="text" id="searchShelterName" name="searchShelterName"
             class="form-control"
             [(ngModel)]="searchParams.name"
             (ngModelChange)="searchChanged()"
             placeholder="Enter Shelter Name">
      <button class="btn btn-primary" (click)="searchChanged()" aria-label="Search">
        <i class="bi bi-search"></i>
      </button>
    </div>
  </div>

</div>

<div class="mt-3">
  <table class="table table-hover">
    <thead>
    <tr>
      <th>Name</th>
      <th class="min-width">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let shelter of shelters" class="center-td">
      <td>{{ shelter.name }}</td>
      <td>
        <div class="btn-group">
          <a class="btn btn-sm btn-warning" [routerLink]="['/shelter/edit', shelter.id]" aria-label="Edit shelter">
            <i class="bi bi-pencil"></i> Edit
          </a>
          <button type="button" class="btn btn-sm btn-danger"
                  (click)="shelterForDeletion(shelter.name, shelter.id)"
                  data-bs-toggle="modal"
                  data-bs-target="#confirm-delete-dialog"
                  aria-label="Delete shelter">
            <i class="bi bi-trash"></i> Delete
          </button>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
  <app-confirm-delete-dialog [deleteWhat]="nameForDeletion" [DeleteId]="idForDeletion"
                             [Mode]="0"></app-confirm-delete-dialog>
</div>
