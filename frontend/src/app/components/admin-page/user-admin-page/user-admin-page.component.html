<app-header></app-header>

<div class="d-flex justify-content-end mt-3">

  <button class="btn btn-primary mr-1" (click)="reloadUsers()" aria-label="Reload Users">
    <i class="bi bi-arrow-clockwise"></i>
    Reload
  </button>
  <a class="btn btn-primary mr-1" [routerLink]="'/admin'" aria-label="View Users">
    View Shelters
  </a>
</div>


<div class="d-flex justify-content-start mt-3">
  <div class="ms-1">
    <label for="searchUserEmail" class="col-form-label">Search for User</label>
    <div class="input-group">
      <input type="text" id="searchUserEmail" name="searchUserEmail"
             class="form-control"
             [(ngModel)]="searchParams.email"
             (ngModelChange)="searchChanged()"
             placeholder="Enter User Email">
      <button class="btn btn-primary" (click)="searchChanged()" aria-label="Search">
        <i class="bi bi-search"></i>
      </button>
    </div>
  </div>
</div>

<div class="mt-3">
  <table class="table table-hover">
    <thead>
    <tr>
      <th>Email</th>
      <th class="min-width">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let user of users" class="center-td">
      <td>{{ user.email }}</td>
      <td>
        <div class="btn-group">
          <a class="btn btn-sm btn-warning" [routerLink]="['/user/edit', user.id]" aria-label="Edit user">
            <i class="bi bi-pencil"></i> Edit
          </a>
          <button type="button" class="btn btn-sm btn-danger"
                  (click)="userForDeletion(user.email, user.id)"
                  data-bs-toggle="modal"
                  data-bs-target="#user-confirm-delete-dialog"
                  aria-label="Delete User">
            <i class="bi bi-trash"></i> Delete
          </button>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
  <user-app-confirm-delete-dialog [deleteWhat]="nameForDeletion" [DeleteId]="idForDeletion" [Mode]="0"></user-app-confirm-delete-dialog>
</div>
