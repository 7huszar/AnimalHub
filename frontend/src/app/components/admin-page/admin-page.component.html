<app-header></app-header>


<div class="d-flex flex-row w-auto">
  <button class="btn btn-primary mr-1" (click)="reloadShelters()" aria-label="Reload Shelters">
    <i class="bi bi-arrow-clockwise"></i>
    Reload
  </button>
  <span style="flex: 1"></span>
  <a class="btn btn-secondary" routerLink="/shelter/create" aria-label="New shelter">
    <i class="bi bi-plus-lg"></i>
    New Shelter
  </a>
</div>

<div class="ms-1">
  Search for Shelter
  <label for="searchShelterName" class="col-form-label">
    Name
  </label>
  <input type="text" id="searchShelterName" name="searchShelterName"
         class="form-control"
         [(ngModel)]="searchParams.name"
         (ngModelChange)="searchChanged()"
  >
</div>

<div class="mt-3">
  <table class="table table-hover">
    <thead>
    <tr>
      <th>Name</th>
      <th class="min-width">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let shelter of shelters" class="center-td">
      <td>{{shelter.name}}</td>
      <td>
        <div class="btn-group">
          <a class="btn btn-sm responsive-warning-button"
             [routerLink]="['/shelter/edit', shelter.id]"
             aria-label="Edit shelter">
            <i class="bi bi-pencil"></i>
          </a>
          <button
            type="button"
            class="btn btn-sm responsive-danger-button"
            (click)="shelterForDeletion(shelter.name, shelter.id)"
            data-bs-toggle="modal"
            data-bs-target="#confirm-delete-dialog"
            aria-label="Delete shelter">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
  <app-confirm-delete-dialog [deleteWhat]="nameForDeletion" [DeleteId]="idForDeletion" [Mode]="0"  > </app-confirm-delete-dialog>
</div>
