<div class="modal fade" id="confirm-delete-dialog" tabindex="-1" aria-labelledby="confirm-delete-dialog-title" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="confirm-delete-dialog-title">{{'CONFIRM_DELETE_DIALOG.TITLE' | translate}}</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {{'CONFIRM_DELETE_DIALOG.QUESTION_PART_1_' + deleteModeString | translate}}"{{deleteName}}"{{'CONFIRM_DELETE_DIALOG.QUESTION_PART_2' | translate}}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">{{'CONFIRM_DELETE_DIALOG.NO' | translate}}</button>
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" (click)="delete()">{{'CONFIRM_DELETE_DIALOG.YES' | translate}}</button>
      </div>
    </div>
  </div>
</div>
