<div class="form-group mb-4" [formGroup]="loginForm">
  <input type="text"
         name="username"
         formControlName="email"
         class="form-control
         form-control-lg"
         id="inputUsername"
         aria-describedby="usernameHelp"
         placeholder="{{'LOGIN.USERNAME_PLACEHOLDER' | translate}}"
         [ngClass]="visual()">
  <div *ngIf="submitted && loginForm.controls.email.errors" class="error">
    <small class="form-text text-danger" *ngIf="loginForm.controls.email.errors.required">
      {{'LOGIN.USER_NAME_MISSING' | translate}}
    </small>
    <small class="form-text text-danger" *ngIf="loginForm.controls.email.errors.email
                    && !loginForm.controls.email.errors.maxlength">
      {{'LOGIN.MAIL_INVALID' | translate}}
    </small>
    <small class="form-text text-danger" *ngIf="loginForm.controls.email.errors.maxlength">
      {{'LOGIN.MAIL_LONG' | translate}}
    </small>
  </div>
</div>
