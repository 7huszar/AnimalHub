<img id="image" *ngIf="content!==undefined&&isImage()" [style.border-radius.em]="(this.mode === Mode.SHELTER_HOME || this.mode === Mode.ANIMAL_HOME) ? 1 : 0" [src]="content" alt="image" width="100%" height="100%" [class]="setClass"/>

<video controls *ngIf="content!==undefined&&isVideo()" width="100%" height="100%" [class]="setClass">
    <source [src]="content"/>
    <p>
        Your browser doesn't support HTML video. Here is a
        <a [href]="content">link to the video</a> instead.
    </p>
</video>
