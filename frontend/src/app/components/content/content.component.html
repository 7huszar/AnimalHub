<img *ngIf="content!==undefined&&isImage()" [src]="content" alt="image" width="100%" height="100%"/>

<video controls *ngIf="content!==undefined&&isVideo()" width="100%" height="100%">
    <source [src]="content"/>
    <p>
        Your browser doesn't support HTML video. Here is a
        <a [href]="content">link to the video</a> instead.
    </p>
</video>
