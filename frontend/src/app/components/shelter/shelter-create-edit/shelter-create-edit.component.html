<app-header></app-header>

<br>
<form #form="ngForm" [class.was-validated]="form.submitted" (ngSubmit)="onSubmit(form)">
  <div class="row">
    <div class="mb-2 col-lg-6">
      <div class="row">
        <label for="shelterName" class="col-form-label text-md-end text-muted col-md-2 col-lg-4">
          Name
        </label>
        <div class="col-md-10 col-lg-8">
          <input type="text" id="shelterName" name="shelterName" placeholder="Shelter name"
          class="form-control" [class]="dynamicCssClassesForInput(shelterNameModel)" [(ngModel)]="shelter.name"
          maxlength="200" #shelterNameModel="ngModel" required>
        </div>
        <div class="invalid-feedback">
          Name is required
        </div>
      </div>
    </div>
    <div class="mb-2 col-lg-6">
      <div class="row">
        <label for="shelterImage" class="col-form-label text-md-end text-muted col-md-2 col-lg-4">
          Image
        </label>
        <div class="col-md-10 col-lg-8">
          <input type="file" id="shelterImage" name="shelterImage" accept="image/png, image/jpeg, image/gif"
          (change)="onImageSelected($event)" class="form-control">
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="mb-2 col-lg-6">
      <div class="row">
        <label for="shelterAddress" class="col-form-label text-md-end text-muted col-md-2 col-lg-4">
          Address
        </label>
        <div class="col-md-10 col-lg-8">
          <input type="text" id="shelterAddress" name="shelterAddress" placeholder="Shelter address"
          class="form-control" [class]="dynamicCssClassesForInput(shelterAddressModel)" [(ngModel)]="shelter.address"
          maxlength="400" #shelterAddressModel="ngModel" required>
        </div>
      </div>
    </div>
    <div class="mb-2 col-lg-6">
      <div class="row">
        <div class="col-md-10 col-lg-8 position-relative">
          <img [ngSrc]="shelterImageURL" alt="" [style.object-fit]="'contain'">
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="mg-2 col-lg-6">
      <div class="row">
        <label for="shelterPhoneNumber" class="col-form-label text-md-end text-muted col-md-2 col-lg-4">
          Phone-Number
        </label>
        <div class="col-md-10 col-lg-8">
          <input type="text" id="shelterPhoneNumber" name="shelterPhoneNumber" placeholder="06501234567"
          class="form-control" [class]="dynamicCssClassesForInput(shelterPhoneNumberModel)" [(ngModel)]="shelter.phoneNumber"
          maxlength="50" #shelterPhoneNumberModel="ngModel" required>
        </div>
      </div>
    </div>
    <div class="mg-2 col-lg-6">
      <div class="row">
        <label for="shelterEmail" class="col-form-label text-md-end text-muted col-md-2 col-lg-4">
          Email
        </label>
        <div class="col-md-10 col-lg-8">
          <input type="text" id="shelterEmail" name="shelterEmail" placeholder="user@animalhub"
          class="form-control" [class]="dynamicCssClassesForInput(shelterEmailModel)" [(ngModel)]="shelter.email"
          maxlength="100" #shelterEmailModel="ngModel" required>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-4 d-flex flex-row">
    <button type="button" class="btn btn-danger" *ngIf="!modeIsCreate" (click)="onDelete()">
      <i class="bi bi-trash"></i>
    </button>
    <span class="flex-grow-1"></span>
    <button type="submit" class="btn btn-primary" [disabled]="!form.valid">
      {{submitButtonText}}
    </button>
  </div>
</form>
