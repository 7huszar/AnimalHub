<app-header></app-header>

<div class="container" *ngIf="shelter">
  <div class="shelter-details">
    <h1 class="mt-4 mb-4" style="margin-left: 1rem">{{ shelter?.name }}</h1>

    <div class="row">
      <div class="col" style="max-width: 10em; min-height: 10em">
        <div class="media">
          <app-content [mode]="Mode.SHELTER" [id]="shelter?.id"></app-content>
        </div>
      </div>

      <div class="col">
        <div class="container position-relative" style="height: 100%; padding-left: 0; margin-left: 1rem">
          <div class="row align-items-end">
            <div class="col-auto">{{ 'SHELTER_HOMEPAGE.ADDRESS' | translate }}</div>
            <div class="col">{{ shelter?.address }}</div>
          </div>

          <div class="row align-items-end">
            <div class="col-auto">{{ 'SHELTER_HOMEPAGE.PHONE' | translate }}</div>
            <div class="col">{{ shelter.phoneNumber }}</div>
          </div>

          <div class="row align-items-end">
            <div class="col-auto">{{ 'SHELTER_HOMEPAGE.EMAIL' | translate }}</div>
            <div class="col">{{ shelter.email }}</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <br/>

  <app-animal-list [animals]="animals" [shelterId]="shelter.id"></app-animal-list>
</div>
