<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Cards</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    .card {
      margin: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="mt-4 mb-4">Animal Cards</h1>

  <div class="form-group">
    <label for="filter">Filter by:</label>
    <select id="filter" class="form-control">
      <option value="all">All Animals</option>
      <option value="mammal">Mammals</option>
      <option value="bird">Birds</option>
      <!-- Add more options as needed -->
    </select>
  </div>

  <div id="animal-cards" class="row"></div>
</div>

<!-- Edit Animal Modal -->
<div class="modal" id="editAnimalModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Animal</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <!-- Add form fields for editing animal details -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>
