<div class="modal fade" id="confirm-delete-dialog" tabindex="-1" aria-labelledby="confirm-delete-dialog-title" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title" id="confirm-delete-dialog-title">Delete</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Do you really want to delete {{deleteType}} “{{deleteWhat}}“?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No, stop</button>
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" (click)="deleteEntity()">Yes, delete</button>
      </div>
    </div>
  </div>
</div>
