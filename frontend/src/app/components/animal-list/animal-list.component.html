<div class="container">
  <div class="col input-container">
    <div class="input-group">
      <div class="search-container">
        <input [(ngModel)]="searchTermName" (input)="onInput()" placeholder="{{'ANIMAL_LIST.NAME' | translate}}" class="form-control">
        <i class="bi bi-search search-icon"></i>
      </div>
      <div class="search-container">
        <input [(ngModel)]="searchTermSpecies" (input)="onInput()" placeholder="{{'ANIMAL_LIST.SPECIES' | translate}}" class="form-control">
        <i class="bi bi-search search-icon"></i>
      </div>
    </div>
  </div>
  <div id="animal-cards" class="row">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let animal of displayedAnimals | paginate: { itemsPerPage: 12, currentPage: p }">
      <div class="card animal-card">
        <app-content [mode]="Mode.ANIMAL" [id]="animal.id" setClass="card-img-top"/>
        <div class="card-body">
          <h5 class="card-title">{{ animal.name }}</h5>
          <p class="card-text">{{ animal.species.charAt(0).toUpperCase() + animal.species.toLowerCase().slice(1) }}</p>
            <button class="btn btn-primary" (click)="editAnimal(animal.id)">Details</button>
            <button class="btn btn-danger" *ngIf="authService.isMember()" (click)="deleteAnimal(animal.id)" style="position: absolute; bottom: 1rem; right: 1rem;">
              <i class="bi bi-trash"></i>
            </button>
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-center pagination-container">
    <pagination-controls (pageChange)="p = $event"></pagination-controls>
  </div>
</div>
<div class="lang" style="position: absolute; bottom: 2rem; right: 1rem;" >
  <app-lang-select></app-lang-select>
</div>
