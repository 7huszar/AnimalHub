<div class="container" style="min-width: 90%">
  <div class="col input-container">
    <div class="input-group">
      <div class="search-container">
        <input [(ngModel)]="searchTermName" (input)="onInput()" placeholder="{{'ANIMAL_LIST.NAME' | translate}}"
               class="form-control">
        <i class="bi bi-search search-icon"></i>
      </div>
      <div class="search-container">
          <select class="form-select" id="animalSpecies" name="animalSpecies" [(ngModel)]="searchTermSpecies" (change)="onInput()" >
            <option value="" selected>{{'ANIMAL_LIST.ALL_SPECIES' | translate}}</option>
            <option value="DOG">{{'ANIMAL_LIST.DOG' | translate}}</option>
            <option value="CAT">{{'ANIMAL_LIST.CAT' | translate}}</option>
            <option value="BIRD">{{'ANIMAL_LIST.BIRD' | translate}}</option>
            <option value="RODENT">{{'ANIMAL_LIST.RODENT' | translate}}</option>
          </select>
      </div>
      <div>
        <button *ngIf="isUserAllowed()" (click)="addAnimal()"
                class="btn btn-primary">{{'ANIMAL_LIST.ADD_ANIMAL' | translate}}</button>
      </div>
    </div>
  </div>
  <div id="animal-cards" class="row">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3"
         *ngFor="let animal of displayedAnimals | paginate: { itemsPerPage: 12, currentPage: p }">
      <div class="card animal-card">
        <app-content [mode]="Mode.ANIMAL" [id]="animal.id" setClass="card-img-top"/>
        <div class="card-body">
          <h5 class="card-title">{{ animal.name }}</h5>
          <p class="card-text">{{ animal.species.charAt(0).toUpperCase() + animal.species.toLowerCase().slice(1) }}</p>
          <button class="btn btn-primary" (click)="editAnimal(animal.id)">Details</button>



          <button type="button" class="custom-danger-btn"
                  (click)="animalForDeletion(animal.name, animal.id)"
                  data-bs-toggle="modal"
                  data-bs-target="#confirm-delete-dialog"
                  aria-label="Delete shelter">
            <i class="bi bi-trash"></i> Delete
          </button>
        </div>
      </div>
    </div>
    <app-confirm-delete-dialog [deleteName]="nameForDeletion" [DeleteId]="idForDeletion" [deleteType]="typeForDeletion"></app-confirm-delete-dialog>

  </div>
  <div class="d-flex justify-content-center pagination-container">
    <pagination-controls (pageChange)="p = $event"></pagination-controls>
  </div>
</div>
