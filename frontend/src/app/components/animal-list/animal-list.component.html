<div class="container">
  <div id="animal-cards" class="row">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let animal of displayedAnimals">
      <div class="card">
        <img [src]="animal.imageUrl" class="card-img-top" alt="Animal Image">
        <div class="card-body">
          <h5 class="card-title">{{ animal.name }}</h5>
          <p class="card-text">Type: {{ animal.species }}</p>
          <button class="btn btn-primary" (click)="editAnimal(animal.id)">Edit</button>
        </div>
      </div>
    </div>
  </div>
  <nav aria-label="Page navigation example">
    <ul class="pagination justify-content-center">
      <li class="page-item disabled">
        <a class="page-link" href="#" tabindex="-1">Previous</a>
      </li>
      <li class="page-item"><a class="page-link" href="#">1</a></li>
      <li class="page-item"><a class="page-link" href="#">2</a></li>
      <li class="page-item"><a class="page-link" href="#">3</a></li>
      <li class="page-item">
        <a class="page-link" href="#">Next</a>
      </li>
    </ul>
  </nav>
</div>
