<div class="container">
  <div class="row-cols-4">
  <div class="col">
<i class="bi bi-globe-americas"></i>
  </div>
  <div class="col">
<div class="dropdown">
  <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
    {{"LANG_SELECT.DROPDOWN" | translate}}
  </button>
  <ul class="dropdown-menu">
    <li><option class="dropdown-item" (click)="setLang(lang)" *ngFor="let lang of getLangs()" [value]="lang" >{{formattedLang(lang)}}</option></li>
  </ul>
</div>
  </div>
  </div>
</div>
