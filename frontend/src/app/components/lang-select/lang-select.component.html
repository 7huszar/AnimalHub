<div class="container">
  <div class="row align-items-center justify-content-end">
    <div class="col-auto me-0 pe-0">
    </div>
    <div class="col-auto ms-0 ps-0">
      <div>
        <div ngbDropdown autoClose="true" class="dropdown">
          <button style="width: 100%" class="btn btn-outline-dark dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-globe-americas text-black me-1"></i>
<!--            {{"LANG_SELECT.DROPDOWN" | translate}}-->
          </button>
          <div ngbDropdownMenu  style="width: 100%; overflow: auto;">
            <div *ngFor="let lang of getLangs()"
                 ngbDropdownItem
                 style="width: 100%;"
                 class="custom-dropDownItem"
                 (click)="setLang(lang)">
              {{formattedLang(lang)}}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
