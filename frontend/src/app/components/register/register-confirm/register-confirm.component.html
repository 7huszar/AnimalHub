
<div class="custom-head position-fixed top-0 end-0">
  <img class="logo position-absolute top-50 start-50 translate-middle" src="/assets/img/logo.png" alt="img">
</div>

<div class="left-visual d-none d-sm-block d-sm-none d-md-block">
  <img class="start-pic" src="/assets/img/gratisography-cool-cat.png" alt="img">
</div>


<div class="my-tmp">
  <div class="container">
    <div class="row gy-2 justify-content-center">
      <div class="col-12 col-sm-10 mb-3 justify-content-center text-center">
        {{'REGISTER.CONFIRM.VERIFY_TEXT' | translate}}
      </div>
      <div class="col-12 col-sm-10">
        <button type="button" (click)="verify()" class="btn btn-primary mb-2" style="width: 100%">
          {{'REGISTER.CONFIRM.VERIFY' | translate}}
        </button>
      </div>
      <div class="col-12 col-sm-10">
        <button type="button" (click)="discard()" class="btn btn-danger mb-2" style="width: 100%">
          {{'REGISTER.CONFIRM.DISCARD' | translate}}
        </button>
      </div>
    </div>
  </div>
</div>

<div class="position-absolute end-0 bottom-0 mb-4 me-4">
  <app-lang-select></app-lang-select>
</div>
