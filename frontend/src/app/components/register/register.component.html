<app-header></app-header>

<div class="my-tmp">
    <div class="row">
        <div class="col-md-6">
            <span class="anchor" id="formLogin"></span>

            <div>
                <div>
                    <h4 class="mb-2">{{'LOGIN.LOGIN_TITLE' | translate}}</h4>
                </div>

                <div>
                    <form class="form" [formGroup]="loginForm" (ngSubmit)="register()">

                        <div class="form-group mb-2">
                            <input type="text" name="username" formControlName="username" class="form-control" id="inputUsername"
                                   aria-describedby="usernameHelp" placeholder="{{'LOGIN.USERNAME_PLACEHOLDER' | translate}}">
                            <div  class="error">
                                <small class="form-text text-warning" >Your username is
                                    required!
                                </small>
                            </div>
                        </div>

                        <div class="form-group mb-2">
                            <input type="password" name="password" formControlName="password" class="form-control" id="password"
                                   placeholder="{{'LOGIN.PWD_PLACEHOLDER' | translate}}">
                            <div  class="error">
                                <small class="form-text text-warning" >Your password
                                    is
                                    required!
                                </small>
                                <small class="form-text text-warning" >Your password
                                    must be at least 8 characters long!
                                </small>
                            </div>
                        </div>

                        <div class="form-group mb-2">
                            <input type="password" name="password" formControlName="password" class="form-control" id="password-repeat"
                                   placeholder="{{'LOGIN.PWD_PLACEHOLDER' | translate}}">
                            <div  class="error">
                                <small class="form-text text-warning" >Your password
                                    is
                                    required!
                                </small>
                                <small class="form-text text-alert" >Your password
                                    must be at least 8 characters long!
                                </small>
                            </div>
                        </div>


                        <button type="button" class="btn btn-primary mb-2">{{'LOGIN.LOGIN_BUTTON' | translate}}</button>

                    </form>


                </div>

            </div>


        </div>

    </div>
</div>

<app-lang-select></app-lang-select>
