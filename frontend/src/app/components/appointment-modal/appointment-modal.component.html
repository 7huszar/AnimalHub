<ng-template #content let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="appointment-title">{{header}}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="actionFinished()"></button>
  </div>
  <div class="modal-body">
    <div *ngIf="appointment.user && isModeConfirm()" class="form-floating mb-3">
      <input type="text" class="form-control" id="userEmail" placeholder="" [ngModel]="appointment.user.email" [disabled]="true">
      <label for="userEmail">{{'APPOINTMENT.USER_EMAIL' | translate}}</label>
    </div>

    <div *ngIf="appointment.shelter" class="form-floating mb-3">
      <input type="text" class="form-control" id="shelterName" placeholder="" [ngModel]="appointment.shelter.name" [disabled]="true">
      <label for="shelterName">{{'APPOINTMENT.SHELTER' | translate}}</label>
    </div>

    <div *ngIf="appointment.animal" class="form-floating mb-3">
      <input type="text" class="form-control" id="animalName" placeholder="" [ngModel]="appointment.animal.name" [disabled]="true">
      <label for="animalName">{{'APPOINTMENT.ANIMAL' | translate}}</label>
    </div>

    <div *ngIf="appointment.animal" class="form-floating mb-3">
      <select class="form-select" id="appointmentType" [(ngModel)]="appointment.type" #appointmentType="ngModel"
              [disabled]="!isModeCreate()" required [class.is-invalid]="appointmentType.invalid && (appointmentType.dirty ||appointmentType.touched)">
        <option [value]="AppointmentType.PLAY">{{'APPOINTMENT.PLAY' | translate}}</option>
        <option [value]="AppointmentType.WALK">{{'APPOINTMENT.WALK' | translate}}</option>
      </select>
      <label for="appointmentType">{{'APPOINTMENT.TYPE' | translate}}</label>
    </div>

    <div class="container mb-3">
      <div class="dp-hidden position-absolute">
        <div class="input-group">
          <input name="datepicker" class="form-control" ngbDatepicker #datepicker="ngbDatepicker" [autoClose]="'outside'"
                 (dateSelect)="onDateSelection($event, datepicker)" [displayMonths]="1" [dayTemplate]="t" outsideDays="hidden"
                 [startDate]="fromDate!" tabindex="-1">
          <ng-template #t let-date let-focused="focused">
            <span class="custom-day"
                  [class.focused]="focused"
                  [class.range]="isRange(date)"
                  [class.faded]="isHovered(date) || isInside(date)"
                  (mouseenter)="hoveredDate = date"
                  (mouseleave)="hoveredDate = null"
            >
              {{date.day}}
            </span>
          </ng-template>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <div class="input-group">
            <input #dpFromDate id="dpFromDate" class="form-control" placeholder="yyyy-mm-dd" name="dpFromDate"
                   [value]="formatter.format(fromDate)" (input)="fromDate = validateInput(fromDate, dpFromDate.value)"
                   [disabled]="!isModeCreate()">
            <button class="btn btn-outline-primary bi bi-calendar3" (click)="datepicker.toggle()" type="button"
                    [disabled]="!isModeCreate()"></button>
          </div>
        </div>
        <div class="col">
          <div class="input-group">
            <input #dpToDate id="dpToDate" class="form-control" placeholder="yyyy-mm-dd" name="dpToDate"
                   [value]="formatter.format(toDate)" (input)="toDate = validateInput(toDate, dpToDate.value)"
                   [disabled]="!isModeCreate()">
            <button class="btn btn-outline-primary bi bi-calendar3" (click)="datepicker.toggle()" type="button"
                    [disabled]="!isModeCreate()"></button>
          </div>
        </div>
      </div>
    </div>

    <div class="container mb-3">
      <div class="row">
        <div class="col">
          <ngb-timepicker [(ngModel)]="fromTime" [hourStep]="1" [minuteStep]="15" [disabled]="!isModeCreate()"></ngb-timepicker>
        </div>
        <div class="col">
          <ngb-timepicker [(ngModel)]="toTime" [hourStep]="1" [minuteStep]="15" [disabled]="!isModeCreate()"></ngb-timepicker>
        </div>
      </div>
    </div>

    <div class="form-floating mb-3">
      <input #titleInput="ngModel" class="form-control" placeholder="" id="titleInput" [(ngModel)]="appointment.title"
             [disabled]="!isModeCreate()" required [class.is-invalid]="titleInput.invalid && (titleInput.dirty || titleInput.touched)">
      <label for="titleInput">{{'APPOINTMENT.TITLE' | translate}}</label>
    </div>

    <div class="form-floating mb-3">
      <textarea #msgArea="ngModel" class="form-control" placeholder="" id="msgArea" style="height: 80px" [(ngModel)]="appointment.msg"
                [disabled]="!isModeCreate()" required [class.is-invalid]="msgArea.invalid && (msgArea.dirty || msgArea.touched)"></textarea>
      <label for="msgArea">{{'APPOINTMENT.MSG' | translate}}</label>
    </div>

    <div *ngIf="isModeDelete" class="form-floating mb-3">
      <select class="form-select" id="appointmentStatus" [(ngModel)]="appointment.status" [disabled]="true">
        <option [value]="AppointmentStatus.PENDING">{{'APPOINTMENT.PENDING' | translate}}</option>
        <option [value]="AppointmentStatus.ACCEPTED">{{'APPOINTMENT.ACCEPTED' | translate}}</option>
        <option [value]="AppointmentStatus.DECLINED">{{'APPOINTMENT.DECLINED' | translate}}</option>
      </select>
      <label for="appointmentStatus">{{'APPOINTMENT.STATUS' | translate}}</label>
    </div>
  </div>
  <div class="modal-footer">
    <button *ngIf="isModeCreate()" type="button" class="btn btn-primary" (click)="create()" [disabled]="!isValid()">{{'APPOINTMENT.CREATE_BTN' | translate}}</button>
    <button *ngIf="isModeConfirm()" type="button" class="btn btn-primary" (click)="confirm()">{{'APPOINTMENT.CONFIRM_BTN' | translate}}</button>
    <button *ngIf="isModeConfirm()" type="button" class="btn btn-danger" (click)="decline()">{{'APPOINTMENT.DECLINE_BTN' | translate}}</button>
    <button *ngIf="isModeDelete()" type="button" class="btn btn-danger" (click)="delete()">{{'APPOINTMENT.DELETE_BTN' | translate}}</button>
  </div>
</ng-template>
