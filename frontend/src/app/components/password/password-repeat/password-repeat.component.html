<app-password #pwd [higherCause]="pwd.value() === pwdRep.value()" ></app-password>
<app-password #pwdRep [eye]="false" [higherCause]="pwd.value() === pwdRep.value()" [pwdField]="pwd.visible()"></app-password>

<div *ngIf="submitted && !(pwd.value() === pwdRep.value())" class="error">
  <small class="form-text text-danger">
    {{'REGISTER.PWD_MISS_MATCH' | translate}}
  </small>
</div>
