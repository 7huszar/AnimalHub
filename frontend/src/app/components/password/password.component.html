<div class="form-group mb-4" [formGroup]="loginForm">
  <div class="input-icon-wrapper">
    <input [type]="pwdField"
           name="password"
           formControlName="password"
           class="form-control form-control-lg"
           [ngClass]="visual()"
           id="password"
           placeholder="{{'LOGIN.PWD_PLACEHOLDER' | translate}}">
    <i class="bi bi-eye pwd-eye-close" (click)="togglePwd()" *ngIf="pwdField === 'text' && eye"></i>
    <i class="bi bi-eye-slash pwd-eye-open" (click)="togglePwd()" *ngIf="pwdField === 'password' && eye"></i>
  </div>
  <div *ngIf="submitted && loginForm.controls.password.errors" class="error">
    <small class="form-text text-danger" *ngIf="loginForm.controls.password.errors.required">
      {{'LOGIN.PWD_MISSING' | translate}}
    </small>
    <small class="form-text text-danger" *ngIf="loginForm.controls.password.errors.minlength">
      {{'LOGIN.PWD_SHORT' | translate}}
    </small>
    {{loginForm.controls.password.errors.maxLength}}
    <small class="form-text text-danger" *ngIf="loginForm.controls.password.errors.maxlength">
      {{'LOGIN.PWD_LONG' | translate}}
    </small>
  </div>
</div>
