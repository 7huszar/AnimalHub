<svg [attr.width]="radius * 2" [attr.height]="radius * 2">
  <circle class="custom-circle"
          [attr.r]="radius - 16"
          [attr.cx]="radius"
          [attr.cy]="radius"
          stroke="green"
          stroke-width="8"
          fill="transparent"
          [style.stroke-dasharray]="(radius - 16) * 2 * Math.PI"
          [style.transition-duration]="start ? time.toString() + 's' : 0"
          [style.stroke-dashoffset]="start ? 0 : (radius -16) * 2 * Math.PI">
  </circle>
</svg>
